<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciel — météo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sky">
  <div class="sun" id="sun"></div>
  <div class="moon" id="moon"></div>
  <div class="stars" id="stars"></div>
  <div id="clouds"></div>
  <div id="precip"></div>
</div>

<div class="wrap">
  <header>
    <div class="brand"><b>Ciel</b> · météo</div>
    <form id="searchForm">
      <input id="cityInput" type="text" placeholder="Nom d'une ville…" autocomplete="off" required>
      <button type="submit">Chercher</button>
    </form>
    <button id="geoBtn" type="button" title="Utiliser ma position">📍</button>
  </header>

  <div id="status">Cherchez une ville pour commencer, ou utilisez la géolocalisation.</div>

  <section class="hero" id="hero">
    <div class="place" id="placeName"></div>
    <div class="temp" id="temp"></div>
    <div class="desc" id="desc"></div>
    <div class="range" id="range"></div>
  </section>

  <div class="section-label" id="hourlyLabel" style="display:none;">Prochaines heures</div>
  <div class="hourly" id="hourly"></div>

  <div class="section-label" id="daysLabel" style="display:none;">7 prochains jours</div>
  <div class="days" id="days"></div>

  <footer>Données fournies par Open-Meteo — sans clé API requise.</footer>
</div>

<script src="script.js"></script>

</body>
</html>
